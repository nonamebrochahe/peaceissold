<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peace is Sold</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; image-rendering: pixelated; }
  html, body { margin: 0; height: 100%; background: #111; color: #fff;
    font-family: 'Press Start 2P', 'Courier New', monospace; overflow: hidden; }
  #wrap { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  #wrap.bump { animation: bump .45s linear; }
  @keyframes bump {
    0% { transform: translate(0,0); } 12% { transform: translate(-16px, 8px); } 25% { transform: translate(14px, -10px); }
    38% { transform: translate(-12px, -6px); } 50% { transform: translate(10px, 8px); } 62% { transform: translate(-8px, 4px); }
    75% { transform: translate(6px, -4px); } 88% { transform: translate(-3px, 2px); } 100% { transform: translate(0,0); }
  }
  #stage { position: relative; width: 960px; height: 720px; transform-origin: center center; flex: none; }
  canvas { position: absolute; top: 64px; left: 0; width: 960px; height: 576px; background: #2a2a2a; image-rendering: pixelated; }
  #hud { position: absolute; top: 0; left: 0; width: 960px; height: 64px; background: #3b281d;
    display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 13px; border-bottom: 4px solid #704b31; }
  #hud span { margin-right: 14px; }
  #hud { box-shadow: inset 0 3px 0 rgba(255,220,170,.08); }
  #baseBar { display: inline-block; width: 90px; height: 14px; background: #400; border: 3px solid #000; vertical-align: middle; margin-left: 6px; }
  #baseFill { height: 100%; width: 100%; background: #0f0; }
  .hbtn { font-family: inherit; font-size: 12px; padding: 10px 12px; background: #3a7; color: #fff; border: 4px solid #000; text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000; cursor: pointer; margin-left: 6px; }
  .hbtn:disabled { background: #684a34; cursor: not-allowed; }

  /* BOTTOM SHOP: small square buttons, price only */
  #shop { position: absolute; top: 640px; left: 0; width: 960px; height: 80px; background: #3b281d;
    border-top: 4px solid #704b31; box-shadow: inset 0 3px 0 rgba(255,220,170,.06); display: flex; align-items: center; justify-content: center; gap: 12px; }
  .tbtn { position: relative; width: 66px; height: 66px; padding: 4px 2px; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    background: #69472d; border: 4px solid #000; color: #fd0; font-family: inherit; font-size: 10px; cursor: pointer; text-shadow: 2px 2px 0 #000; }
  .tbtn:hover { background: #805a39; }
  .tbtn.sel { background: #3a7; outline: 4px solid #ff0; }
  .tbtn.poor { opacity: .45; }
  .tbtn .ico { width: 36px; height: 36px; background-size: contain; background-repeat: no-repeat; background-position: center; }
  /* Rainbow towers (BAKLAVADA): the green parts of the sprite cycle through every colour. White/black stay. */
  .ico.rb { animation: rbHue 3s linear infinite; }
  @keyframes rbHue { from { filter: hue-rotate(0deg); } to { filter: hue-rotate(360deg); } }
  .tbtn .ico.dogoda-mini { position:relative; background:none !important; filter:none !important; }
  .dogoda-mini img { position:absolute; object-fit:contain; image-rendering:pixelated; filter:none !important; -webkit-filter:none !important; }
  .dogoda-mini .mini-body { width:27px; height:27px; left:5px; top:0; z-index:1; }
  .dogoda-mini .mini-amp { width:22px; height:21px; left:-7px; bottom:-2px; z-index:2; }
  /* Guitar is held across DOGODA's body, not a tiny prop floating beside it. */
  .dogoda-mini .mini-guitar { width:27px; height:17px; left:13px; top:7px; right:auto; bottom:auto; z-index:3; transform:rotate(-28deg); transform-origin:center; }
  .dogoda-shop-preview { position:relative; background:none !important; filter:none !important; }
  .dogoda-shop-preview img { position:absolute; object-fit:contain; image-rendering:pixelated; filter:none !important; -webkit-filter:none !important; }
  .dogoda-shop-preview .preview-body { width:65px; height:65px; left:8px; top:0; z-index:1; }
  .dogoda-shop-preview .preview-amp { width:44px; height:41px; left:-9px; bottom:-4px; z-index:2; }
  .dogoda-shop-preview .preview-guitar { width:60px; height:38px; left:22px; top:18px; right:auto; bottom:auto; z-index:3; transform:rotate(-28deg); transform-origin:center; }

  #info { position: absolute; top: 76px; right: 12px; width: 230px; background: rgba(61,40,25,.94); border: 4px solid #000; padding: 12px; font-size: 10px; line-height: 2; z-index: 6; }
  #info .info-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:4px; }
  #info #iName { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #info #btnTargetMode { flex:0 0 auto; max-width:116px; padding:6px 8px; border:3px solid #161f35; background:#287d8e; color:#fff3d6; font-family:inherit; font-size:8px; line-height:1.2; cursor:pointer; box-shadow:inset 0 2px 0 #54b9c3; }
  #info #btnTargetMode:hover { background:#359fb0; }
  #info #btnTargetMode:disabled { opacity:.4; cursor:not-allowed; }
  #info .hbtn { margin: 6px 6px 0 0; font-size: 9px; padding: 8px; }

  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(180deg, #bfe3c0 0%, #8fc68f 55%, #5f9a62 100%); z-index: 10; text-align: center; padding: 20px; overflow: hidden; }
  .screen > * { position: relative; z-index: 2; }
  /* Shared scenic background for all front-end screens. */
  #menu, #maps, #inventory, #shopScreen, #end { background: #4b301d; isolation: isolate; }
  #menu .menu-bg { position: absolute !important; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0 !important; pointer-events: none; }
  #maps::before, #inventory::before, #shopScreen::before, #end::before { content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none; background: url('images/textures/mainmenu.png') center / cover no-repeat; }
  #menu::after, #maps::after, #inventory::after, #shopScreen::after, #end::after { content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none; background: linear-gradient(180deg, rgba(0,0,0,.10), rgba(0,0,0,.48)); }
  #menu .cloud { position: absolute !important; display: block; width: 240px; height: auto; image-rendering: auto; object-fit: contain; filter: none !important; -webkit-filter: none !important; z-index: 2 !important; pointer-events: none; opacity: .95; animation: cloudDrift 34s linear infinite; backface-visibility: visible; }
  #menu .cloud.c1 { top: 8%; left: -280px; animation-delay: -7s; }
  #menu .cloud.c2 { top: 27%; left: -340px; width: 180px; opacity: .8; animation-duration: 46s; animation-delay: -25s; }
  @keyframes cloudDrift { 0% { transform: translateX(0); } 100% { transform: translateX(1500px); } }
  #menu .tree { z-index: 2 !important; }
  #menu #leafCv { z-index: 3 !important; }
  #menu h1, #menu .gemrow, #menu .rbtn { z-index: 4; }
  #maps > *, #inventory > *, #shopScreen > *, #end > * { z-index: 2; }
  #inventoryCards { width:min(900px,100%); max-height:390px; overflow-y:auto; gap:12px; align-content:flex-start; padding:12px; display:flex; flex-wrap:wrap; justify-content:center; }
  #inventoryCards .card { width:190px; height:215px; min-width:190px; max-width:190px; margin:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; overflow:hidden; }
  .tower-level { color:#fff36a; font-size:10px; margin:5px 0; }
  .card-status { display:block; color:#b8ef9a; font-size:9px; line-height:1.6; margin-top:2px; }
  .tick { display:inline-block; color:#7dff6a; font-family:Arial, Helvetica, sans-serif; font-size:22px; font-weight:bold; line-height:1; text-shadow:2px 2px 0 #000; }
  /* Summon sprites jiggle (squash & stretch) like they do in the game. */
  .card.jiggle .ico { transform-origin:50% 100%; animation:jiggle .75s ease-in-out infinite; }
  .card.jiggle .ico.rb { animation:jiggle .75s ease-in-out infinite, rbHue 3s linear infinite; }
  @keyframes jiggle {
    0%   { transform:scale(1,1) rotate(0deg); }
    20%  { transform:scale(1.10,.90) rotate(-5deg); }
    40%  { transform:scale(.92,1.10) rotate(0deg); }
    60%  { transform:scale(1.10,.90) rotate(5deg); }
    80%  { transform:scale(.94,1.07) rotate(0deg); }
    100% { transform:scale(1,1) rotate(0deg); }
  }
  /* Player level sits at the very bottom of the screen content. */
  .xp-panel { width:min(420px,90%); margin:14px 0 0; padding:10px; border:4px solid #24180d; background:rgba(0,0,0,.38); font-size:10px; line-height:2; }
  .xp-track { width:100%; height:12px; border:2px solid #000; background:#302014; margin-top:4px; }
  .xp-fill { height:100%; width:0%; background:#76e35c; }
  #summonResult { min-height:40px; max-width:700px; color:#fff36a; font-size:11px; line-height:2; margin:8px 0; }
  .shop-price { display:block; margin:7px 0; color:#ffd95a; font-size:10px; line-height:2; }

  /* SUMMON CARDS (grassland / desert) */
  #summonOptions { display:flex; flex-wrap:nowrap; justify-content:center; gap:28px; margin:10px 0 16px; }
  .summon-card { width:230px; padding:8px; background:#7a5230; border:6px solid #3a200c; color:#fff3d6; font-family:inherit; font-size:11px; line-height:1.8;
    text-shadow:2px 2px 0 #000; cursor:pointer; transition:transform .15s, background .15s; }
  .summon-card:hover:not(:disabled) { background:#8f6340; transform:none; }
  .summon-card:disabled { opacity:.5; cursor:not-allowed; }
  .summon-card img { display:block; width:100%; height:auto; min-height:90px; object-fit:contain; background:#3d2a1c; border:4px solid #000; margin-bottom:8px; image-rendering:pixelated !important; image-rendering:crisp-edges !important; filter:none !important; -webkit-filter:none !important; opacity:1 !important; transform:none !important; backface-visibility:visible; }
  .summon-card, .summon-card * { filter:none !important; -webkit-filter:none !important; }
  .summon-card:disabled { opacity:1; cursor:not-allowed; }
  .summon-card:disabled img { opacity:1 !important; }
  .summon-card .sc-name { display:block; font-size:14px; }
  .summon-card .sc-price { display:block; color:#ffd95a; font-size:11px; margin-top:4px; }

  /* SUMMON REVEAL: slow suspense, then the tower pops in. */
  #shopScreen > #summonReveal { position:absolute; inset:0; z-index:30; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(0,0,0,.82); animation:revealFade .5s ease-out both; }
  @keyframes revealFade { from { opacity:0; } to { opacity:1; } }
  #revealStage, #revealText, #btnRevealOk { position:absolute; z-index:2; }
  #revealStage { left:50%; top:48%; transform:translate(-50%,-50%); width:min(92%,560px); height:350px; display:flex; align-items:center; justify-content:center; perspective:900px; }
  #revealText { left:50%; bottom:62px; transform:translateX(-50%); width:92%; margin:0; }
  #btnRevealOk { position:absolute; left:50%; bottom:14px; transform:translateX(-50%); margin:0; }
  /* Use the PNG's own aspect ratio, so there are no fake side gutters. */
  #revealBox.charging {
    position:relative; width:230px; height:300px; flex:none; display:block;
    background:transparent; border:0; border-radius:0; box-shadow:none;
    padding:0; margin:0; font-size:0; overflow:visible; isolation:isolate;
    animation:charge 1.9s ease-in forwards; transform-origin:50% 50%;
  }
  #revealBox.charging::before, #revealBox.charging::after { content:none !important; }
  .pack-tear-half { position:absolute; inset:0; overflow:hidden; pointer-events:none; will-change:transform,opacity; }
  .pack-tear-half img { position:absolute; inset:0; display:block; width:100%; height:100%; object-fit:contain; image-rendering:pixelated; }
   /* Keep the reveal centered and reserve a stable area for rarity text below it. */
   #revealStage { position:absolute; left:50%; top:48%; transform:translate(-50%,-50%); width:min(92%,560px); height:350px; flex:0 0 350px; display:flex; align-items:center; justify-content:center; }
   #revealBox { margin:0 auto; }
   #revealText { position:relative; z-index:2; flex:0 0 auto; min-height:58px; height:auto; max-width:min(92%,720px); text-align:center; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; }
   #revealText > span { display:block; line-height:1.8; }
  .pack-tear-top { clip-path:polygon(0 0,100% 0,100% 47%,94% 49%,87% 47%,80% 51%,72% 48%,65% 52%,57% 48%,50% 52%,43% 48%,35% 52%,27% 48%,19% 51%,11% 48%,5% 51%,0 49%); transform-origin:50% 50%; }
  .pack-tear-bottom { clip-path:polygon(0 49%,5% 51%,11% 48%,19% 51%,27% 48%,35% 52%,43% 48%,50% 52%,57% 48%,65% 52%,72% 48%,80% 51%,87% 47%,94% 49%,100% 47%,100% 100%,0 100%); transform-origin:50% 50%; }
  #revealBox.tearing { animation:none !important; }
  #revealBox.tearing .pack-tear-top { animation:packTearTop .82s cubic-bezier(.22,.72,.18,1) both; }
  #revealBox.tearing .pack-tear-bottom { animation:packTearBottom .82s cubic-bezier(.22,.72,.18,1) both; }
  @keyframes packTearTop {
    0% { transform:translate3d(0,0,0) rotate(0) scale(1); opacity:1; }
    18% { transform:translate3d(1px,-3px,0) rotate(1deg); opacity:1; }
    42% { transform:translate3d(5px,-17px,0) rotate(3deg); opacity:1; }
    72% { transform:translate3d(16px,-78px,0) rotate(9deg); opacity:.9; }
    100% { transform:translate3d(30px,-210px,0) rotate(19deg); opacity:0; }
  }
  @keyframes packTearBottom {
    0% { transform:translate3d(0,0,0) rotate(0) scale(1); opacity:1; }
    18% { transform:translate3d(-1px,3px,0) rotate(-1deg); opacity:1; }
    42% { transform:translate3d(-5px,17px,0) rotate(-3deg); opacity:1; }
    72% { transform:translate3d(-14px,78px,0) rotate(-8deg); opacity:.9; }
    100% { transform:translate3d(-28px,210px,0) rotate(-17deg); opacity:0; }
  }
  #revealBox.revealed { width:auto !important; height:auto !important; min-width:0; min-height:0; background:transparent; border:0; box-shadow:none; overflow:visible; animation:none; }
  .reveal-tower { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; width:auto; min-width:0; padding:0; margin:0; background:transparent; border:0; box-shadow:none; text-shadow:2px 2px 0 #000; }
  .reveal-tower-sprite { display:flex; align-items:center; justify-content:center; min-width:0; min-height:0; background:transparent; border:0; padding:0; margin:0; filter:drop-shadow(0 0 20px rgba(255,225,90,.55)); transform-origin:50% 100%; }
  .reveal-tower-sprite .ico { margin:0 !important; }
  .reveal-tower .tower-level { color:#fff36a; font-size:12px; margin:4px 0 0; }
  .reveal-tower .card-status { color:#fff3d6; font-size:11px; line-height:1.5; margin-top:0; }
  #revealBox.tower-rising .reveal-tower-sprite { animation:towerRise .78s cubic-bezier(.16,.85,.25,1.2) both; }
  #revealBox.tower-rising .reveal-tower { animation:revealMeta .45s ease-out .22s both; }
  @keyframes towerRise { 0% { transform:translateY(145px) scale(.2); opacity:0; } 62% { transform:translateY(-10px) scale(1.15); opacity:1; } 82% { transform:translateY(4px) scale(.98); } 100% { transform:translateY(0) scale(1); opacity:1; } }
  @keyframes revealMeta { from { transform:translateY(12px); opacity:0; } to { transform:translateY(0); opacity:1; } }
  @keyframes charge {
    0% { transform:rotate(0deg); opacity:.25; }
    18% { transform:rotate(0deg); opacity:1; }
    35% { transform:rotate(-1deg); }
    50% { transform:rotate(1.5deg); }
    68% { transform:rotate(-2deg); }
    84% { transform:rotate(2deg); }
    100% { transform:rotate(-1deg); opacity:1; }
  }
  #revealFlash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:5; }
  #revealFlash.go { animation:flashOut .7s ease-out; }
  @keyframes flashOut { 0% { opacity:.95; } 100% { opacity:0; } }
  #revealText { min-height:30px; margin-top:14px; font-size:12px; line-height:2; color:#fff3d6; text-shadow:2px 2px 0 #000; }
  #revealText.dots::after { content:""; animation:dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content:""; } 25% { content:"."; } 50% { content:".."; } 75% { content:"..."; } }
  #btnRevealOk { margin-top:10px; }

  /* SUMMON REVEAL LAYOUT FIX: keep every result element in one centered vertical flow.
     Order is tower -> LEVEL -> duplicate/new status -> RARITY -> OK. */
  #shopScreen > #summonReveal {
    display:flex !important;
    flex-direction:column !important;
    align-items:center !important;
    justify-content:center !important;
    gap:0 !important;
    overflow-y:auto;
    padding:20px 12px !important;
    box-sizing:border-box;
  }
  #summonReveal #revealStage {
    position:relative !important;
    left:auto !important; top:auto !important; bottom:auto !important; right:auto !important;
    transform:none !important;
    width:min(92vw,560px) !important;
    height:clamp(210px,42vh,350px) !important;
    min-height:210px;
    flex:0 0 auto !important;
    margin:0 auto 8px !important;
  }
  #summonReveal #revealText {
    position:relative !important;
    left:auto !important; top:auto !important; bottom:auto !important; right:auto !important;
    transform:none !important;
    width:min(92vw,600px) !important;
    max-width:600px !important;
    min-height:0 !important;
    height:auto !important;
    flex:0 0 auto !important;
    margin:0 auto !important;
    padding:0 8px !important;
    display:flex !important;
    flex-direction:column !important;
    align-items:center !important;
    justify-content:center !important;
    gap:3px !important;
    text-align:center !important;
    line-height:1.5 !important;
    overflow-wrap:anywhere;
  }
  #summonReveal #revealText > span {
    display:block !important;
    width:100%;
    line-height:1.5 !important;
    margin:0 !important;
  }
  #summonReveal #btnRevealOk {
    position:relative !important;
    left:auto !important; top:auto !important; bottom:auto !important; right:auto !important;
    transform:none !important;
    display:block;
    flex:0 0 auto !important;
    margin:14px auto 0 !important;
    min-width:110px;
    z-index:4 !important;
  }
  #summonReveal #btnRevealOk.hidden { display:none !important; }
  #summonReveal .reveal-tower { gap:4px !important; }
  #summonReveal .reveal-tower .tower-level {
    display:block !important;
    margin:5px 0 0 !important;
    line-height:1.5 !important;
  }
  @media (max-height:560px) {
    #shopScreen > #summonReveal { justify-content:flex-start !important; }
    #summonReveal #revealStage { height:200px !important; min-height:200px; }
    #summonReveal #btnRevealOk { margin-top:8px !important; }
  }

  /* SECRET REVEAL (BAKLAVADA): the screen goes black, rainbow question marks appear, then the tower shows up. */
  #secretLayer { position:absolute; inset:0; z-index:1; overflow:hidden; pointer-events:none; }
  #shopScreen > #summonReveal.secret { animation:secretDark 1.3s ease-in both; background:#000; }
  @keyframes secretDark { from { background:rgba(0,0,0,0); } to { background:rgba(0,0,0,1); } }
  #revealBox.secretbox { opacity:0; font-size:150px; line-height:1; color:#f33; text-shadow:6px 6px 0 #000, 0 0 30px rgba(255,255,255,.5);
    animation:secretShake .14s linear infinite, rbHue 2s linear infinite; }
  #revealBox.secretbox.show { opacity:1; animation:secretShake .14s linear infinite, rbHue 2s linear infinite, secretGrow 2.6s ease-in forwards; }
  @keyframes secretShake {
    0% { margin:0 0 0 0; } 25% { margin:-4px 0 0 4px; } 50% { margin:4px 0 0 -4px; } 75% { margin:-3px 0 0 -3px; } 100% { margin:0; }
  }
  @keyframes secretGrow { from { transform:scale(.4); } to { transform:scale(1.7); } }
  .qm { position:absolute; font-family:inherit; font-weight:bold; color:#f33; text-shadow:4px 4px 0 #000; line-height:1;
    animation:qmPop .45s cubic-bezier(.2,1.6,.4,1) both, rbHue 2.4s linear infinite; }
  @keyframes qmPop { from { transform:scale(0) rotate(-30deg); opacity:0; } to { transform:scale(1) rotate(var(--r,0deg)); opacity:1; } }
  .rbtext { display:inline-block; color:#f33; text-shadow:2px 2px 0 #000; animation:rbHue 1.6s linear infinite; }

  .tree { position: absolute !important; bottom: 0; width: 280px; height: 600px; object-fit: contain; object-position: left bottom; z-index: 1 !important; transform-origin: 50% 100%; pointer-events: none; }
  .tree.left { left: -20px; animation: swayL 8s ease-in-out infinite; }
  .tree.right { right: -20px; animation: swayR 8s ease-in-out infinite; }
  @keyframes swayL { 0%,100% { transform: rotate(-.8deg); } 50% { transform: rotate(.8deg); } }
  @keyframes swayR { 0%,100% { transform: scaleX(-1) rotate(-.8deg); } 50% { transform: scaleX(-1) rotate(.8deg); } }
  #leafCv { position: absolute !important; top: 0; left: 0; width: 960px; height: 720px; background: transparent; z-index: 3 !important; pointer-events: none; }
  /* First-load screen: the NEXT click also unlocks browser audio playback. */
  #loadingScreen { position:absolute; inset:0; z-index:1000; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px; overflow:hidden; background:#4b301d url('images/textures/mainmenu.png') center/cover no-repeat; text-align:center; }
  #loadingScreen::before { content:""; position:absolute; inset:0; background:rgba(0,0,0,.42); pointer-events:none; }
  #loadingScreen > * { position:relative; z-index:1; }
  #loadingTitle { margin:0; font-size:28px; line-height:1.7; color:#fff3d6; text-shadow:4px 4px 0 #3a200c; animation:none; }
  #loadingStatus { font-size:10px; line-height:2; color:#fff3d6; text-shadow:2px 2px #000; }
  #loadingTrack { width:min(440px,80%); height:22px; border:4px solid #3a200c; background:#2c1d13; padding:2px; }
  #loadingFill { height:100%; width:0%; background:#8bca68; transition:width .25s ease; }
  #nextButton { display:none; min-width:240px; margin:0; font-size:18px; padding:18px 28px; }
  #nextButton.ready { display:block; }
  .hidden { display: none !important; }
  h1 { font-size: 40px; margin: 0 0 40px; line-height: 1.5; color: #fff3d6; text-shadow: 4px 4px 0 #3a200c; animation: floaty 5s ease-in-out infinite; }

  #msg { position: absolute; top: 78px; left: 50%; transform: translateX(-50%); width: max-content; max-width: 88%; padding: 12px 16px; background: rgba(61,40,25,.97); border: 4px solid #000; box-shadow: 4px 4px 0 rgba(0,0,0,.45); text-align: center; font-size: 10px; line-height: 1.8; color: #ffed55; pointer-events: none; text-shadow: 2px 2px 0 #000; z-index: 20; }
  #msg:empty { display: none; }

</style>

<body>
<div id="wrap">
<div id="stage">

    <canvas id="leafCv" width="960" height="720"></canvas>

    <h1>PEACE<br>IS SOLD</h1>
    <div class="gemrow"><span class="gemico gi"></span><b class="gemcount">0</b></div>
    <button class="rbtn" id="btnPlay">PLAY</button>
    <button class="rbtn" id="btnInventory" style="font-size:16px">TOWERS</button>
    <button class="rbtn" id="btnShopMenu" style="font-size:16px">SUMMON</button>
    <div class="xp-panel"><div id="menuPlayerLevel">PLAYER LEVEL 1</div><div class="xp-track"><div class="xp-fill" id="menuXpFill"></div></div><div id="menuXpText">0 / 100 XP</div></div>
  </div>

  <!-- ONE MAP, THREE DIFFICULTY OPTIONS -->

        <button class="rbtn small" id="difficultyMedium" style="font-size:12px;min-width:0;width:92%;margin:5px 0;border-color:#684500;background:#ad7a20">MEDIUM · 20 WAVES</button>
        <button class="rbtn small" id="difficultyHard" style="font-size:12px;min-width:0;width:92%;margin:5px 0;border-color:#6b1717;background:#a93232">HARD · 40 WAVES</button>

  </div>

  <!-- TOWER SUMMON (cards) -->

      </button>

    <!-- summon reveal overlay -->

      <div id="secretLayer"></div>

    <button class="rbtn" id="btnAgain">PLAY AGAIN</button>
    <button class="rbtn" id="btnToMenu">MAIN MENU</button>
  </div>

</div>

<script>
/* ================== SETTINGS ================== */
const IMG = {
  grass:      'images/textures/grass.png',
  dirt:       'images/textures/dirt.png',
  gems:       'images/textures/gems.png',
  leaves:     'images/textures/leaves.png',
  greenistan: 'images/enemies/greenistan.png',
  redistan:   'images/enemies/redistan.png',
  atardeli:   'images/weapons/atardeli.png',
  knife:      'images/weapons/knife.png',
  rainsword:  'images/weapons/rainsword.png', // BAKLAVADA's sword (green parts become rainbow)
  deli:       'images/projectiles/deli.png',
  delice:     'images/towers/delici.png',
  dolten:     'images/towers/dolten.png', // DOLTEN uses its original, untinted sprite
  dolten2:    'images/towers/dolten2.png', // optional: falls back to dolten.png if missing
  efe:        'images/towers/efe.png',
  dogoda:     'images/towers/dogoda.png',
  baklavada:  'images/towers/baklavada.png', // secret tower (green parts become rainbow)
  guitar:     'images/projectiles/guitar.png',
  ampProjectile: 'images/projectiles/amp.png',
  boss: 'images/enemies/boss.png',
  // desert map
  sand:       'images/textures/sand.png',
  sandpath:   'images/textures/sandpath.png',
  cactus:     'images/textures/cactus.png',
  sandity:    'images/enemies/sandity.png',
  sandity1:   'images/enemies/sandity1.png',
  sandity2:   'images/enemies/sandity2.png',
  sandity3:   'images/enemies/sandity3.png',
  sandboss:   'images/enemies/sandboss.png',
  sandboss2:  'images/enemies/sandboss2.png',
  // MAX farm tower (3 stages)
  max:        'images/towers/max.png',
  max2:       'images/towers/max2.png',
  max3:       'images/towers/max3.png'
};

// Main-menu music. It is intentionally NOT started on page load: the
// loading screen's NEXT button is the user's gesture that unlocks audio in browsers.
const menuMusic = new Audio('audios/mainmenu.mp3');
menuMusic.loop = true;
menuMusic.preload = 'auto';
menuMusic.volume = 0.45;
let musicWanted = false;
let gameplayMusicMuted = false;
function startMenuMusic() {
  musicWanted = true;
  gameplayMusicMuted = false;
  if (menuMusic.paused) {
    const attempt = menuMusic.play();
    if (attempt && attempt.catch) attempt.catch(err => console.warn('Menu music could not start:', err));
  }
}
function stopMenuMusic() {
  gameplayMusicMuted = true;
  musicWanted = false;
  menuMusic.pause();
  try { menuMusic.currentTime = 0; } catch (e) {}
}
menuMusic.addEventListener('error', () => console.error('Music failed to load. Check that audios/mainmenu.mp3 exists next to the HTML file.', menuMusic.error));

// DOGODA's supporter track plays while at least one DOGODA tower is on the field.
const dogodaMusic = new Audio('audios/dogoda.mp3');
dogodaMusic.loop = true;
dogodaMusic.preload = 'auto';
dogodaMusic.volume = 0.42;
function startDogodaMusic() {
  if (!running || !Array.isArray(towers) || !towers.some(t => t.type && t.type.id === 'dogoda')) return;
  dogodaMusic.volume = 0.50;
  prepareDogodaAnalyser();
  if (dogodaAudioContext && dogodaAudioContext.state === 'suspended') {
    dogodaAudioContext.resume().catch(err => console.warn('DOGODA audio context could not resume:', err));
  }
  if (dogodaMusic.paused) {
    const attempt = dogodaMusic.play();
    if (attempt && attempt.catch) attempt.catch(err => console.warn('DOGODA music could not start; check audios/dogoda.mp3 and browser audio permissions.', err));
  }
}
function stopDogodaMusic() {
  dogodaMusic.pause();
  try { dogodaMusic.currentTime = 0; } catch (e) {}
  dogodaBeatPulse = 0;
  dogodaLastBass = 0;
  dogodaBassAverage = 0;
  dogodaVolumeLevel = 0;
  dogodaLastAudioBeatTime = -10;
  dogodaLastMetronomeIndex = -1;
  musicParticles = [];
}
dogodaMusic.addEventListener('error', () => console.error('DOGODA track failed to load. Check audios/dogoda.mp3.', dogodaMusic.error));

// Map music: audios/grassland.mp3 and audios/desert.mp3 play during a run.
// As soon as a DOGODA is on the field the map music fades out and dogoda.mp3 takes over.
const MAP_MUSIC_VOLUME = 0.40;   // normal level during a run
const MAP_MUSIC_DUCKED = 0;      // level while a DOGODA is on the field (0 = fully cut; try 0.05 to keep it barely audible)
const mapMusicTracks = { grass: new Audio('audios/grassland.mp3'), desert: new Audio('audios/desert.mp3') };
Object.values(mapMusicTracks).forEach(a => {
  a.loop = true; a.preload = 'auto'; a.volume = 0;
  a.addEventListener('error', () => console.error('Map music failed to load. Check the audios folder:', a.src));
});
let mapMusicActive = null, mapMusicLevel = 0, dogodaTrackFailed = false;
dogodaMusic.addEventListener('error', () => { dogodaTrackFailed = true; });
function startMapMusic() {
  stopMapMusic();
  mapMusicActive = mapMusicTracks[selectedMap] || mapMusicTracks.grass;
  mapMusicLevel = MAP_MUSIC_VOLUME;
  mapMusicActive.volume = mapMusicLevel;
  try { mapMusicActive.currentTime = 0; } catch (e) {}
  const attempt = mapMusicActive.play();
  if (attempt && attempt.catch) attempt.catch(err => console.warn('Map music could not start:', err));
}
function stopMapMusic() {
  if (mapMusicActive) {
    mapMusicActive.pause();
    try { mapMusicActive.currentTime = 0; } catch (e) {}
  }
  mapMusicActive = null;
  mapMusicLevel = 0;
}
function updateMapMusic(dt) {
  if (!mapMusicActive || !running) return;
  const hasDogoda = !dogodaTrackFailed && Array.isArray(towers) && towers.some(t => t.type && t.type.id === 'dogoda');
  const target = hasDogoda ? MAP_MUSIC_DUCKED : MAP_MUSIC_VOLUME;
  const step = MAP_MUSIC_VOLUME * dt / 1.2; // ~1.2 second fade
  mapMusicLevel += Math.max(-step, Math.min(step, target - mapMusicLevel));
  mapMusicActive.volume = Math.max(0, Math.min(1, mapMusicLevel));
  if (mapMusicLevel <= 0.001) {
    if (!mapMusicActive.paused) mapMusicActive.pause();
  } else if (mapMusicActive.paused) {
    const attempt = mapMusicActive.play();
    if (attempt && attempt.catch) attempt.catch(() => {});
  }
}

// DOGODA visual rhythm: use the actual song's low-frequency energy when Web Audio
// is available, with a small song-clock metronome pulse as a fallback.
const DOGODA_METRONOME_BPM = 120; // fallback only; live bass transients drive the main beat
let dogodaAudioContext = null, dogodaAnalyser = null, dogodaMediaSource = null;
let dogodaFrequencyData = null;
let dogodaLastBass = 0, dogodaBassAverage = 0, dogodaLastBeatAt = 0;
let dogodaLastAudioBeatTime = -10, dogodaLastMetronomeIndex = -1;
let dogodaBeatPulse = 0, dogodaBeatSerial = 0;
let dogodaVolumeLevel = 0; // smoothed live music energy (0..1), used to shake/stretch the amp
let musicParticles = [];

function prepareDogodaAnalyser() {
  if (dogodaAnalyser || dogodaAudioContext) return;
  const AudioCtor = window.AudioContext || window.webkitAudioContext;
  if (!AudioCtor) return;
  try {
    const audioContext = new AudioCtor();
    const analyser = audioContext.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.42;
    const source = audioContext.createMediaElementSource(dogodaMusic);
    source.connect(analyser);
    analyser.connect(audioContext.destination);
    dogodaAudioContext = audioContext;
    dogodaAnalyser = analyser;
    dogodaMediaSource = source;
    dogodaFrequencyData = new Uint8Array(analyser.frequencyBinCount);
  } catch (err) {
    console.warn('DOGODA beat analysis unavailable; using the visual metronome fallback.', err);
  }
}

function emitDogodaBeat() {
  dogodaBeatPulse = 1;
  dogodaBeatSerial++;
  for (const source of (towers || [])) {
    if (!source.type || source.type.id !== 'dogoda') continue;
    // Music notes now travel from DOGODA to the regular towers it is boosting.
    // No area rings/circles are needed: the moving notes visualize the support buff.
    for (const target of (towers || [])) {
      if (target === source || !target.type || target.type.support || target.type.farm) continue;
      if (Math.hypot(target.x - source.x, target.y - source.y) > source.type.supportRange) continue;
      const life = 1.05;
      musicParticles.push({
        x: source.x - source.type.size * 0.05,
        y: source.y - source.type.size * 0.34,
        vx: 0, vy: 0,
        targetTower: target,
        speed: 300 + Math.random() * 80,
        arrived: false,
        life, maxLife: life,
        glyph: Math.random() < 0.5 ? '♪' : '♫',
        size: 14 + Math.random() * 8,
        color: Math.random() < 0.5 ? '#ffe36c' : '#ff79d1',
        rot: (Math.random() - 0.5) * 0.25,
        spin: (Math.random() - 0.5) * 1.2
      });
    }
  }
  if (musicParticles.length > 160) musicParticles.splice(0, musicParticles.length - 160);
}

function updateDogodaRhythm(dt) {
  dogodaBeatPulse = Math.max(0, dogodaBeatPulse - dt * 5.8);
  const hasDogoda = running && Array.isArray(towers) && towers.some(t => t.type && t.type.id === 'dogoda');
  if (!hasDogoda) {
    musicParticles = [];
    dogodaLastBass = 0;
    dogodaBassAverage = 0;
    return;
  }

  // Detect bass/kick transients from the soundtrack itself. A debounce prevents
  // several shakes for one drum hit.
  if (!dogodaMusic.paused && dogodaAnalyser && dogodaFrequencyData) {
    try {
      dogodaAnalyser.getByteFrequencyData(dogodaFrequencyData);
      let bass = 0, bassCount = 0, energy = 0, energyCount = 0;
      for (let i = 1; i <= Math.min(8, dogodaFrequencyData.length - 1); i++) {
        bass += dogodaFrequencyData[i]; bassCount++;
      }
      // Measure a broader band as well as bass, then smooth it to avoid jitter.
      for (let i = 2; i <= Math.min(48, dogodaFrequencyData.length - 1); i++) {
        energy += dogodaFrequencyData[i]; energyCount++;
      }
      bass = bassCount ? bass / bassCount : 0;
      const rawVolume = energyCount ? energy / energyCount : 0;
      const normalizedVolume = Math.max(0, Math.min(1, (rawVolume - 10) / 92));
      dogodaVolumeLevel += (normalizedVolume - dogodaVolumeLevel) * Math.min(1, dt * 8.5);
      const now = performance.now();
      const baseline = Math.max(12, dogodaBassAverage * 1.22);
      const kick = bass > baseline && bass > dogodaLastBass * 1.10 && now - dogodaLastBeatAt > 220;
      if (kick) {
        emitDogodaBeat();
        dogodaLastBeatAt = now;
        dogodaLastAudioBeatTime = dogodaMusic.currentTime;
        dogodaLastMetronomeIndex = Math.floor(dogodaMusic.currentTime / (60 / DOGODA_METRONOME_BPM));
      }
      dogodaBassAverage = dogodaBassAverage ? dogodaBassAverage * 0.92 + bass * 0.08 : bass;
      dogodaLastBass = bass;
    } catch (err) {
      // Keep animation running even if a browser does not expose analyser data.
    }
  }

  // If audio analysis is unavailable, keep a little metronome motion. When the
  // music is paused, ease the live volume estimate smoothly back to zero.
  if (dogodaMusic.paused || !dogodaAnalyser) {
    dogodaVolumeLevel = Math.max(0, dogodaVolumeLevel - dt * 1.8);
  }
  const songTime = !dogodaMusic.paused ? dogodaMusic.currentTime : time;
  const beatPeriod = 60 / DOGODA_METRONOME_BPM;
  const beatIndex = Math.floor(songTime / beatPeriod);
  const quietTooLong = dogodaMusic.paused || !dogodaAnalyser || songTime - dogodaLastAudioBeatTime > 0.85;
  if (quietTooLong && beatIndex !== dogodaLastMetronomeIndex) {
    dogodaLastMetronomeIndex = beatIndex;
    emitDogodaBeat();
  }

  for (const particle of musicParticles) {
    if (particle.targetTower) {
      // Fly each note toward the tower receiving DOGODA's buff.
      if (!towers.includes(particle.targetTower)) {
        particle.life = 0;
        continue;
      }
      const target = particle.targetTower;
      const tx = target.x;
      const ty = target.y - target.type.size * 0.40;
      if (!particle.arrived) {
        const dx = tx - particle.x, dy = ty - particle.y;
        const distance = Math.hypot(dx, dy);
        const step = particle.speed * dt;
        if (distance <= step + 2) {
          particle.x = tx; particle.y = ty;
          particle.arrived = true;
          particle.life = Math.min(particle.life, 0.22);
        } else if (distance > 0) {
          particle.x += dx / distance * step;
          particle.y += dy / distance * step;
        }
      }
    } else {
      particle.x += particle.vx * dt;
      particle.y += particle.vy * dt;
      particle.vy -= 8 * dt;
    }
    particle.rot += particle.spin * dt;
    particle.life -= dt;
  }
  musicParticles = musicParticles.filter(p => p.life > 0);
}

function dogodaMotionPulse() {
  const songTime = !dogodaMusic.paused ? dogodaMusic.currentTime : time;
  const period = 60 / DOGODA_METRONOME_BPM;
  const phase = ((songTime % period) + period) % period / period;
  const metronome = Math.pow(Math.max(0, Math.cos(phase * Math.PI * 2)), 18);
  return dogodaMusic.paused ? 0 : Math.max(dogodaBeatPulse, metronome * 0.16);
}

/* ================== RAINBOW SPRITES ==================
   Every GREEN pixel of a sprite (eyes, body, sword...) is replaced with an animated rainbow.
   White and black (and anything not green) are left exactly as they are. */
const rainbowCache = {};
function rainbowCanvas(key) {
  const im = images[key];
  if (!im) return null;
  let c = rainbowCache[key];
  if (c === undefined) {
    c = null;
    try {
      const w = im.naturalWidth || im.width, h = im.naturalHeight || im.height;
      const mk = () => { const cn = document.createElement('canvas'); cn.width = w; cn.height = h; return cn; };
      const base = mk(), mask = mk(), out = mk();
      const bx = base.getContext('2d'), mx = mask.getContext('2d');
      bx.drawImage(im, 0, 0);
      const src = bx.getImageData(0, 0, w, h), d = src.data;
      const md = mx.createImageData(w, h), m = md.data;
      for (let i = 0; i < d.length; i += 4) {
        const r = d[i], g = d[i + 1], b = d[i + 2], a = d[i + 3];
        if (a > 0 && g > r + 18 && g > b + 18) {
          // brightness of the original green keeps a bit of shading in the rainbow
          m[i] = 255; m[i + 1] = 255; m[i + 2] = 255; m[i + 3] = a;
          d[i + 3] = 0; // remove it from the base layer
        }
      }
      bx.putImageData(src, 0, 0);
      mx.putImageData(md, 0, 0);
      c = { w, h, base, mask, out, ox: out.getContext('2d'), stamp: -1 };
    } catch (e) {
      console.warn('Rainbow recolor unavailable for', key, '(serve the game from a web server, not file://):', e);
      c = null;
    }
    rainbowCache[key] = c;
  }
  if (!c) return null;
  if (c.stamp !== time) {
    c.stamp = time;
    const o = c.ox;
    o.globalCompositeOperation = 'source-over';
    o.clearRect(0, 0, c.w, c.h);
    o.drawImage(c.mask, 0, 0);
    o.globalCompositeOperation = 'source-in';
    const gr = o.createLinearGradient(0, 0, c.w, c.h);
    const shift = time * 140;
    for (let i = 0; i <= 6; i++) gr.addColorStop(i / 6, 'hsl(' + Math.round((i * 60 + shift) % 360) + ',100%,55%)');
    o.fillStyle = gr;
    o.fillRect(0, 0, c.w, c.h);
    o.globalCompositeOperation = 'source-over';
    o.drawImage(c.base, 0, 0);
  }
  return c.out;
}

  if (rc) ctx.drawImage(rc, x, y, w, h);

}

/* ================== RANDOM PATH ================== */
function genPath() {
  for (let attempt = 0; attempt < 500; attempt++) {
    const set = new Set();
    const startY = 1 + Math.floor(Math.random() * (ROWS - 2));
    let x = 0, y = startY, ok = true;
    const pts = [[0, y]];
    set.add('0,' + y);
    const step = (nx, ny) => {
      const dx = Math.sign(nx - x), dy = Math.sign(ny - y);
      while (x !== nx || y !== ny) {
        const px = x, py = y;
        x += dx; y += dy;
        if (set.has(x + ',' + y)) return false;
        for (const [ax, ay] of [[1,0],[-1,0],[0,1],[0,-1]]) {
          const k = (x + ax) + ',' + (y + ay);
          if (set.has(k) && !(x + ax === px && y + ay === py)) return false;
        }
        set.add(x + ',' + y);
      }
      pts.push([x, y]);
      return true;
    };
    const segs = 2 + Math.floor(Math.random() * 3); // 2-4 turns before the exit
    for (let s = 0; s < segs && ok; s++) {
      // horizontal move
      let nx;
      do { nx = 1 + Math.floor(Math.random() * (COLS - 2)); } while (Math.abs(nx - x) < 3);
      ok = step(nx, y);
      if (!ok) break;
      // vertical move
      let ny, tries = 0;
      do { ny = Math.floor(Math.random() * ROWS); tries++; } while (Math.abs(ny - y) < 2 && tries < 30);
      if (Math.abs(ny - y) < 2) { ok = false; break; }
      ok = step(x, ny);
    }
    if (!ok) continue;
    if (!step(COLS - 1, y)) continue;
    if (set.size < 28) continue;
    pathTiles = set;
    pathPts = pts.map(p => ({ x: p[0] * TILE + TILE / 2, y: p[1] * TILE + TILE / 2 }));
    pathPts[0].x = -TILE / 2;
    pathPts[pathPts.length - 1].x = COLS * TILE + TILE / 2;
    return;
  }
  // fallback path
  const W = [[0,1],[12,1],[12,4],[2,4],[2,7],[14,7]];
  pathTiles = new Set(); pathPts = [];
  W.forEach(([x, y], i) => {
    pathPts.push({ x: x * TILE + TILE / 2, y: y * TILE + TILE / 2 });
    if (i > 0) {
      const [px, py] = W[i - 1];
      const dx = Math.sign(x - px), dy = Math.sign(y - py);
      let cx = px, cy = py;
      while (cx !== x || cy !== y) { pathTiles.add(cx + ',' + cy); cx += dx; cy += dy; }
    }
    pathTiles.add(x + ',' + y);
  });
  pathPts[0].x = -TILE / 2;
  pathPts[pathPts.length - 1].x = COLS * TILE + TILE / 2;
}

/* ================== WAVES ================== */
function setWaveCountdown(text) {
  const el = $('waveCountdown');
  if (!el) return;
  if (!text) {
    el.textContent = '';
    el.classList.remove('show');
    return;
  }
  el.textContent = text;
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
}

function currentWaveBatch() {
  return (waveBatches || []).find(batch => batch.id === wave) || null;
}

function currentWaveEnemyCount(waveId = wave) {
  return (enemies || []).reduce((count, enemy) => count + (enemy.waveId === waveId ? 1 : 0), 0);
}

// Skip is available near the end of the latest wave. Skipping never deletes
// its queue or enemies: that wave keeps spawning while the next wave counts down.
function canSkipWave() {
  const batch = currentWaveBatch();
  if (!running || !batch || wave >= MAX_WAVE || waveCountdownRemaining > 0) return false;
  const totalMobs = Math.ceil((6 + batch.id * 1.5) * (DIFFICULTIES[selectedDifficulty] || DIFFICULTIES.easy).mobs * (MAPS[selectedMap] || MAPS.grass).mobMul);
  const remaining = batch.queue.length + currentWaveEnemyCount(batch.id);
  const threshold = Math.max(4, Math.ceil(totalMobs * 0.24));
  return remaining > 0 && remaining <= threshold;
}

function syncSkipWaveButton() {
  const button = $('btnSkipWave');
  const ready = canSkipWave();
  const batch = currentWaveBatch();
  button.disabled = !ready;
  button.classList.toggle('available', ready);
  button.textContent = 'SKIP WAVE';
  // Keep the requested skip-availability notification, but tower selection itself is silent.
  if (ready && batch && !batch.skipReadyNotified) {
    batch.skipReadyNotified = true;
    flash('SKIP WAVE AVAILABLE!');
  }
}

// Skipping pays the wave reward (+ MAX farm income) right away and launches the next wave
// immediately, with no countdown. The skipped wave keeps spawning/moving but won't pay twice.
function skipWave() {
  if (!canSkipWave()) return;
  const batch = currentWaveBatch();
  if (batch) payWaveRewards(batch);
  launchWave();
}

function payWaveRewards(batch) {
  if (batch.paid) return 0;
  batch.paid = true;
  let farm = 0;
  for (const t of towers) {
    if (!t.type.farm) continue;
    const inc = Math.round(t.type.income);
    farm += inc;
    t.punch = 1;
    floatTexts.push({ x: t.x, y: t.y - t.type.size, text: '+' + inc, life: 1.4 });
  }
  const reward = 20 + batch.id * 5 + farm;
  const difficultyGemBonus = selectedDifficulty === 'hard' ? 1.5 : selectedDifficulty === 'medium' ? 1.2 : 1;
  const waveGems = Math.floor((25 + batch.id * 8) * difficultyGemBonus * gemMultiplier());
  money += reward;
  gems += waveGems;
  earnedGems += waveGems;
  save();
  floatTexts.push({ x: 480, y: 72, text: '+' + waveGems + ' GEMS', life: 1.8 });
  flash('WAVE ' + batch.id + ' CLEARED! +' + reward + ' GOLD · +' + waveGems + ' GEMS' + (farm ? ' (FARM +' + farm + ')' : ''));
  hud();
  return reward;
}

function pickEnemyType(w) {
  if (selectedMap === 'desert') {
    const ew = Math.min(w, 10) + Math.max(0, w - 10) * 0.5;
    const slowW = Math.max(0.15, 1 - ew * 0.12);
    const fastW = ew >= 3 ? Math.min(0.85, 0.05 + ew * 0.08) : 0;
    return Math.random() * (slowW + fastW) < slowW ? 'sandity' : 'sandity1';
  }
  const redChance = Math.min(0.15 + w * 0.07 + (selectedDifficulty === 'hard' ? 0.12 : selectedDifficulty === 'medium' ? 0.05 : 0), 0.88);
  return Math.random() < redChance && w > 1 ? 'redistan' : 'greenistan';
}

// Only 3, 2, 1 appear. The countdown has its own DOM layer, so tower actions
// and error notifications cannot replace a number or disturb the timer.
function startWave() {
  if (waveCountdownRemaining > 0 || wave >= MAX_WAVE || !running) return;
  waveCountdownRemaining = 3;
  waveCountdownLastNumber = 3;
  $('btnSkipWave').disabled = true;
  $('btnSkipWave').classList.remove('available');
  setWaveCountdown('3');
}

function launchWave() {
  if (wave >= MAX_WAVE || !running) return;
  waveCountdownRemaining = 0;
  waveCountdownLastNumber = 0;
  setWaveCountdown('');
  wave++;
  addPlayerXP(10 + Math.floor(wave * 0.5));
  const queue = [];
  const difficulty = DIFFICULTIES[selectedDifficulty] || DIFFICULTIES.easy;
  const n = Math.ceil((6 + wave * 1.5) * difficulty.mobs * (MAPS[selectedMap] || MAPS.grass).mobMul);
  for (let i = 0; i < n; i++) queue.push(pickEnemyType(wave));
  // The boss appears only in the final wave of the selected difficulty.
  if (wave === MAX_WAVE) queue.push('boss');
  waveBatches.push({
    id: wave,
    queue,
    spawnTimer: Math.max(0.82, 1.12 - wave * 0.006),
    skipReadyNotified: false,
    completed: false,
    paid: false
  });
  hud();
}

function updateWaveCountdown(dt) {
  if (waveCountdownRemaining <= 0 || !running) return;
  waveCountdownRemaining = Math.max(0, waveCountdownRemaining - dt);
  const shownNumber = Math.ceil(waveCountdownRemaining - 0.000001);
  if (shownNumber > 0 && shownNumber < waveCountdownLastNumber) {
    waveCountdownLastNumber = shownNumber;
    setWaveCountdown(String(shownNumber));
  }
  if (waveCountdownRemaining <= 0) launchWave();
}

function spawnEnemy(type, waveId) {
  const difficulty = DIFFICULTIES[selectedDifficulty] || DIFFICULTIES.easy;
  const isBoss = type === 'boss';
  const desert = selectedMap === 'desert';
  const d = isBoss
    ? (desert ? { hp: 1100 + waveId * 60, speed: 31, reward: 160 + waveId * 8, size: 130, dmg: 26 }
              : { hp: 750 + waveId * 45, speed: 27, reward: 130 + waveId * 8, size: 124, dmg: 22 })
    : ENEMY[type];
  // Gradual scaling keeps 20- and 40-wave runs challenging without becoming absurd.
  const MP = MAPS[selectedMap] || MAPS.grass;
  const k = waveId - 1;
  const kh = k * (difficulty.waveScale || 1);
  // HP grows steeply with the wave number (linear + quadratic + a little cubic), so late waves really hurt.
  const waveHpMul = isBoss ? 1 : 1 + 0.10 * kh + 0.014 * kh * kh + 0.0001 * kh * kh * kh;
  const spMul = Math.min(1.6, 1 + k * 0.010);
  const difficultyHp = isBoss ? difficulty.boss : difficulty.hp;
  // The map's HP bonus ramps in over the first 10 waves, so early desert waves are not a wall.
  const mapHpMul = 1 + (MP.hpMul - 1) * Math.min(1, k / 10);
  const hp = d.hp * waveHpMul * difficultyHp * mapHpMul;
  enemies.push({ type, waveId, isBoss, flip: 1, phase: Math.random() * 6.28, x: pathPts[0].x, y: pathPts[0].y, target: 1,
    hp, maxHp: hp, speed: d.speed * spMul * difficulty.speed * MP.speedMul, reward: Math.round(d.reward * MP.rewardMul), size: d.size,
    dmg: d.dmg, img: isBoss ? (desert ? 'sandboss' : 'boss') : type, dir: 1,
    walkImgs: (isBoss && desert) ? ['sandboss', 'sandboss2'] : (type === 'sandity1' ? ['sandity1', 'sandity2', 'sandity3'] : null),
    walkFps: (isBoss && desert) ? 3.5 : 9,
    attackTimer: isBoss ? 3.2 : 0, attackCooldown: isBoss ? 6.2 : 0 });
}

}

/* ================== UPDATE ================== */
// BAKLAVADA's sword: flies out to the edge of its range, spins, then returns to the tower.
// Each enemy can be hit once per pass (once going out, once coming back), so it pierces through crowds.
function updateBoomerang(t, dt) {
  const T = t.type, b = t.boom;
  // Continuous blade spin, independent of its travel direction.
  b.spin += 30 * dt;
  const speed = T.bulletSpeed;
  b.prevX = b.x; b.prevY = b.y;
  const gx = b.out ? b.tx : t.x, gy = b.out ? b.ty : t.y;
  const dx = gx - b.x, dy = gy - b.y, dist = Math.hypot(dx, dy), step = speed * dt;
  if (dist <= step) {
    b.x = gx; b.y = gy;
    if (b.out) { b.out = false; b.hit = new Set(); }
    else { t.boom = null; t.punch = 0.6; return; }
  } else {
    b.x += dx / dist * step; b.y += dy / dist * step;
  }
  // Keep a short, time-based position history so the trail forms a smooth ribbon.
  if (!b.trail) b.trail = [];
  b.trail.push({ x: b.x, y: b.y, age: 0 });
  for (const p of b.trail) p.age += dt;
  b.trail = b.trail.filter(p => p.age < 0.24);
  if (b.trail.length > 20) b.trail.splice(0, b.trail.length - 20);
  const dmg = T.damage * (t.buffMultiplier || 1);
  for (const e of enemies) {
    if (e.hp <= 0 || b.hit.has(e)) continue;
    if (Math.hypot(e.x - b.x, e.y - b.y) <= e.size / 2 + 16) { e.hp -= dmg; b.hit.add(e); }
  }
}

function update(dt) {
  updateWaveCountdown(dt);
  updateDogodaRhythm(dt);
  updateMapMusic(dt);
  for (const f of floatTexts) { f.y -= 34 * dt; f.life -= dt; }
  floatTexts = floatTexts.filter(f => f.life > 0);
  syncSkipWaveButton();

  // Every wave owns a separate queue. After SKIP WAVE, any previous wave's
  // remaining mobs continue spawning and moving while the next wave joins in.
  for (const batch of waveBatches) {
    if (!batch.queue.length) continue;
    batch.spawnTimer -= dt;
    if (batch.spawnTimer <= 0) {
      spawnEnemy(batch.queue.shift(), batch.id);
      // Keep the existing readable spawn pace for every wave independently.
      batch.spawnTimer = Math.max(0.82, 1.12 - batch.id * 0.006);
    }
  }

  for (const e of enemies) {
    const t = pathPts[e.target];
    const dx = t.x - e.x, dy = t.y - e.y, dist = Math.hypot(dx, dy);
    const step = e.speed * dt;
    e.flip += (e.dir - e.flip) * Math.min(1, dt * 12);
    if (dist <= step) {
      e.x = t.x; e.y = t.y; e.target++;
      if (e.target >= pathPts.length) e.escaped = true;
    } else {
      e.x += dx / dist * step; e.y += dy / dist * step;
      if (Math.abs(dx) > 1) e.dir = dx > 0 ? 1 : -1;
    }
  }
  for (const e of enemies) if (e.escaped) { baseHp -= e.dmg; bump(); hud(); }
  enemies = enemies.filter(e => !e.escaped);

  // Boss ground-slam: nearby towers temporarily shut down, turn grey, then recover.
  for (const t of towers) t.disabledTimer = Math.max(0, (t.disabledTimer || 0) - dt);
  for (const boss of enemies) {
    if (!boss.isBoss || boss.hp <= 0) continue;
    boss.attackTimer -= dt;
    if (boss.attackTimer <= 0) {
      boss.attackTimer = boss.attackCooldown;
      const radius = selectedDifficulty === 'hard' ? 166 : selectedDifficulty === 'medium' ? 150 : 138;
      let disabledCount = 0;
      for (const tower of towers) {
        if (Math.hypot(tower.x - boss.x, tower.y - boss.y) <= radius) {
          tower.disabledTimer = Math.max(tower.disabledTimer || 0, selectedDifficulty === 'hard' ? 3.0 : selectedDifficulty === 'medium' ? 2.7 : 2.4);
          disabledCount++;
        }
      }
      boss.slamFlash = 0.75;
      if (disabledCount) flash('BOSS SLAM! ' + disabledCount + ' TOWER' + (disabledCount === 1 ? '' : 'S') + ' DISABLED!');
    }
    boss.slamFlash = Math.max(0, (boss.slamFlash || 0) - dt);
  }

  // DOGODA boosts attack speed and projectile/melee damage of ordinary towers in its aura.
  for (const t of towers) {
    const aura = !t.type.support ? towers.find(s => s.type.support && Math.hypot(s.x - t.x, s.y - t.y) <= s.type.supportRange) : null;
    t.buffMultiplier = aura ? aura.type.attackBoost : 1;
    t.buffed = !!aura;
  }

  for (const t of towers) {
    const T = t.type;
    t.punch *= Math.exp(-dt * 10);
    if (t.punch < 0.01) t.punch = 0;
    if ((t.disabledTimer || 0) > 0) { t.punch = 0; continue; }
    // Support-only towers such as DOGODA never target enemies or create bullets.
    if (T.support || T.farm) { t.aim = 0; t.cd = 0; continue; }
    t.cd -= dt;
    let best = null;
    const mode = t.targetMode || 'closest';
    const inRange = enemies.filter(e => Math.hypot(e.x - t.x, e.y - t.y) <= T.range);
    if (mode === 'leastHealth') best = inRange.reduce((a,e) => !a || e.hp < a.hp ? e : a, null);
    else if (mode === 'strongest') best = inRange.reduce((a,e) => !a || (e.maxHp || e.hp) > (a.maxHp || a.hp) ? e : a, null);
    else if (mode === 'first') best = inRange.reduce((a,e) => !a || (e.pathProgress || 0) > (a.pathProgress || 0) ? e : a, null);
    else if (mode === 'last') best = inRange.reduce((a,e) => !a || (e.pathProgress || 0) < (a.pathProgress || 0) ? e : a, null);
    else best = inRange.reduce((a,e) => { const da=Math.hypot(e.x-t.x,e.y-t.y), db=a?Math.hypot(a.x-t.x,a.y-t.y):Infinity; return da<db?e:a; }, null);
    if (best) {
      const ang = Math.atan2(best.y - t.y, best.x - t.x);
      let d = ang - t.aim;
      d = Math.atan2(Math.sin(d), Math.cos(d));
      t.aim += d * Math.min(1, dt * 14);
      if (T.boomerang) {
        // Throw the sword once it is back in hand.
        if (t.cd <= 0 && !t.boom) {
          t.cd = T.cooldown / ((t.buffMultiplier || 1) * attackMultiplier());
          t.punch = 1;
          // Fly in the target's direction all the way out to the tower's range, so it pierces everything on the line.
          t.boom = { x: t.x, y: t.y, tx: t.x + Math.cos(ang) * T.range, ty: t.y + Math.sin(ang) * T.range, out: true, spin: 0, trail: [], hit: new Set() };
        }
      } else if (t.cd <= 0) {
        t.cd = T.cooldown / ((t.buffMultiplier || 1) * attackMultiplier());
        t.punch = 1;
        if (T.melee) best.hp -= T.damage * (t.buffMultiplier || 1);
        else {
          let projectile = T.bullet;
          if (T.id === 'dogoda') {
            t.shotIndex = (t.shotIndex || 0) + 1;
            projectile = (t.shotIndex % 2 === 0) ? T.bulletAlt : T.bullet;
          }
          // Twin towers (DOLTEN) fire two bullets side by side from their two guns.
          const offsets = T.twin ? [-10, 10] : [0];
          for (const off of offsets) {
            bullets.push({ x: t.x + Math.cos(t.aim) * (T.weaponLen || 0) - Math.sin(t.aim) * off,
              y: t.y + Math.sin(t.aim) * (T.weaponLen || 0) + Math.cos(t.aim) * off,
              target: best, angle: t.aim, type: T, owner: t, projectile, damage: T.damage * (t.buffMultiplier || 1), birthTime: time, phase: Math.random() * Math.PI * 2 });
          }
        }
      }
    }
  }

  // Boomerang swords keep flying even when no enemy is in range (or the tower is disabled).
  for (const t of towers) if (t.boom) updateBoomerang(t, dt);

  for (const b of bullets) {
    if (!b.target || b.target.hp <= 0 || !enemies.includes(b.target)) { b.dead = true; continue; }
    const dx = b.target.x - b.x, dy = b.target.y - b.y, dist = Math.hypot(dx, dy);
    const step = b.type.bulletSpeed * dt;
    b.angle = Math.atan2(dy, dx);
    if (dist <= step + b.target.size / 3) { b.target.hp -= (typeof b.damage === 'number' ? b.damage : b.type.damage); b.dead = true; }
    else { b.x += dx / dist * step; b.y += dy / dist * step; }
  }
  bullets = bullets.filter(b => !b.dead);

  let killedCount = 0;
  for (const e of enemies) if (e.hp <= 0) { money += e.reward; killedCount++; hud(); }
  if (killedCount) addPlayerXP(killedCount * 5);
  enemies = enemies.filter(e => e.hp > 0);

  // Complete each wave independently. A skipped wave is not discarded, and
  // it still awards its clear bonus after every queued/spawned mob is gone.
  let completedAny = false;
  for (const batch of waveBatches) {
    if (!batch.queue.length && !enemies.some(enemy => enemy.waveId === batch.id)) {
      batch.completed = true;
      payWaveRewards(batch); // does nothing if the wave was skipped (already paid)
      completedAny = true;
    }
  }
  if (completedAny) {
    waveBatches = waveBatches.filter(batch => !batch.completed);
    hud();
  }

  // If the latest wave is complete, automatically set up the next one even if
  // older skipped waves still have stragglers on the map. Existing mobs remain.
  const latestWaveStillRunning = waveBatches.some(batch => batch.id === wave);
  if (wave > 0 && wave < MAX_WAVE && !latestWaveStillRunning && waveCountdownRemaining <= 0) {
    startWave();
  }
  if (wave >= MAX_WAVE && waveBatches.length === 0 && waveCountdownRemaining <= 0) return endGame(true);
  if (baseHp <= 0) endGame(false);
}

/* ================== RENDER ================== */
function drawImg(name, x, y, w, h, fallback) {
  const im = images[name];
  if (im) ctx.drawImage(im, x, y, w, h);
  else { ctx.fillStyle = fallback; ctx.fillRect(x, y, w, h); }
}
function setHue(h) { ctx.filter = h ? 'hue-rotate(' + h + 'deg)' : 'none'; }

function render() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const isPath = pathTiles.has(x + ',' + y);
    const M = MAPS[selectedMap] || MAPS.grass;
    drawImg(isPath ? M.path : M.ground, x * TILE, y * TILE, TILE, TILE, isPath ? M.pathFb : M.groundFb);
  }
  for (const k of blockedTiles) {
    const [cx, cy] = k.split(',').map(Number);
    drawImg('cactus', cx * TILE, cy * TILE, TILE, TILE, '#2e7d32');
  }

  const mtx = Math.floor(mouse.x / TILE), mty = Math.floor(mouse.y / TILE);

  if (running && selected && mouse.x >= 0) {
    const T = typeOf(selected);
    const ok = !pathTiles.has(mtx + ',' + mty) && !blockedTiles.has(mtx + ',' + mty) && !towers.some(t => t.tx === mtx && t.ty === mty) && money >= T.cost;
    ctx.fillStyle = ok ? 'rgba(255,255,255,.25)' : 'rgba(255,0,0,.35)';
    ctx.fillRect(mtx * TILE, mty * TILE, TILE, TILE);
    if (!T.support && !T.farm) {
      ctx.strokeStyle = ok ? 'rgba(255,255,255,.5)' : 'rgba(255,80,80,.5)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(mtx * TILE + TILE / 2, mty * TILE + TILE / 2, T.range, 0, Math.PI * 2); ctx.stroke();
    }
  } else if (running && !selected && mouse.x >= 0) {
    const ht = towers.find(t => t.tx === mtx && t.ty === mty);
    if (ht && !ht.type.support && !ht.type.farm) {
      ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(ht.x, ht.y, ht.type.range, 0, Math.PI * 2); ctx.stroke();
    }
  }

  // selected tower: highlight + range
  if (running && selTower) {
    ctx.fillStyle = 'rgba(255,255,0,.2)';
    ctx.fillRect(selTower.tx * TILE, selTower.ty * TILE, TILE, TILE);
    // DOGODA is a supporter, so no attack-range circle is shown for it.
    if (!selTower.type.support && !selTower.type.farm) {
      ctx.strokeStyle = 'rgba(255,255,0,.8)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(selTower.x, selTower.y, selTower.type.range, 0, Math.PI * 2); ctx.stroke();
    }
  }

  // DOGODA amplifiers are drawn in a separate back layer, behind all tower bodies/weapons.
  for (const t of towers) {
    if (t.type.id !== 'dogoda') continue;
    const s=t.type.size, musicPulse=dogodaMotionPulse();
    const beat=!dogodaMusic.paused ? dogodaMusic.currentTime : time;
    const phase=beat*(DOGODA_METRONOME_BPM/60)*Math.PI*2;
    const ampVolume=!dogodaMusic.paused && dogodaAnalyser ? Math.max(dogodaVolumeLevel,dogodaBeatPulse*0.28) : musicPulse*0.52;
    const ampShakeX=Math.sin(time*19+t.tx)*ampVolume*2.0;
    const ampShakeY=Math.sin(time*13+t.ty)*ampVolume*1.2;
    ctx.save();
    ctx.filter=(t.disabledTimer||0)>0?'grayscale(1) brightness(.72)':'none';
    ctx.translate(t.x-s*0.90+Math.sin(phase*0.5)*ampVolume*1.4+ampShakeX, t.y+s*0.08+ampShakeY);
    ctx.rotate(Math.sin(phase*0.42+time*0.7)*ampVolume*0.045);
    const ampScaleY=1+Math.min(0.10,ampVolume*0.10+dogodaBeatPulse*0.025);
    ctx.scale(1,ampScaleY);
    drawImg('ampProjectile',-s*0.43,-s*0.40,s*0.86,s*0.80,'#68452b');
    ctx.restore();
  }

  for (const t of towers) {
    const T = t.type, s = T.size;
    const musicPulse = T.id === 'dogoda' ? dogodaMotionPulse() : 0;
    const rhythmTime = !dogodaMusic.paused ? dogodaMusic.currentTime : time;
    const rhythmicBop = T.id === 'dogoda' ? Math.sin(rhythmTime * (DOGODA_METRONOME_BPM / 60) * Math.PI * 2) * 0.025 : 0;
    const bop = Math.sin(time * 3 + t.tx * 1.7 + t.ty) * 0.05 + rhythmicBop;
    const sq = bop + t.punch * 0.12 + musicPulse * (T.id === 'dogoda' ? 0.05 : 0);
    const shakeX = T.id === 'dogoda' ? Math.sin(time * 47 + t.tx * 2.1) * musicPulse * 5 : 0;
    const shakeY = T.id === 'dogoda' ? -musicPulse * 7 : 0;
    ctx.save();
    setHue((t.disabledTimer || 0) > 0 ? 0 : hueOf(T));
    if ((t.disabledTimer || 0) > 0) ctx.filter = 'grayscale(1) brightness(.72)';
    ctx.translate(t.x + shakeX, t.y + s / 2 + shakeY);
    if (T.id === 'dogoda') ctx.rotate(Math.sin(time * 43 + t.ty) * musicPulse * 0.045);
    ctx.scale(1 - sq + musicPulse * (T.id === 'dogoda' ? 0.055 : 0), 1 + sq + musicPulse * (T.id === 'dogoda' ? 0.075 : 0));
    (T.rainbow ? drawRainbow : drawImg)(bodyOf(T), -s / 2, -s, s, s, '#9b59b6');
    if ((t.disabledTimer || 0) > 0) {
      ctx.filter = 'none';
      ctx.fillStyle = 'rgba(180,190,200,.42)';
      ctx.fillRect(-s / 2, -s, s, s);
    }
    ctx.restore();

    // DOGODA guitar is drawn over the character; the amplifier is rendered in the back layer.
    if (T.id === 'dogoda') {
      const beat = !dogodaMusic.paused ? dogodaMusic.currentTime : time;
      const phase = beat * (DOGODA_METRONOME_BPM / 60) * Math.PI * 2;
      const propShake = Math.sin(phase * 0.5) * (2 + musicPulse * 4);
      const propBounce = -musicPulse * 4 + Math.sin(phase) * 1.5;
      // GUITAR is large and held across DOGODA's torso, angled like a real playing pose.
      // It stays in the character's hands (visual layer), rather than floating at the side or firing as a projectile.
      ctx.save();
      ctx.filter = (t.disabledTimer || 0) > 0 ? 'grayscale(1) brightness(.72)' : 'none';
      ctx.translate(t.x + s * 0.08 + shakeX + propShake * 0.45,
                    t.y - s * 0.04 + shakeY + propBounce * 0.45);
      ctx.rotate(-0.72 + Math.sin(phase + 0.8) * (0.018 + musicPulse * 0.075));
      drawImg('guitar', -s * 0.72, -s * 0.34, s * 1.44, s * 0.68, '#e7b63c');
      ctx.restore();
    }

    // Held weapon. BAKLAVADA's sword disappears from its hand while it is flying as a boomerang.
    if (!(T.boomerang && t.boom)) {
      ctx.save();
      if ((t.disabledTimer || 0) > 0) ctx.filter = 'grayscale(1) brightness(.72)';
      else setHue(T.id === 'dogoda' ? 0 : T.hue);
      ctx.translate(t.x + shakeX, t.y + bop * 20 + shakeY);
      ctx.rotate(t.aim);
      ctx.translate(T.melee ? t.punch * 16 : -t.punch * 6, 0);
      if (T.melee) ctx.rotate(-t.punch * 0.9);
      const w = (T.weaponLen || 0) + 8, h = T.twin ? 22 : 28;
      const gunOffsets = T.twin ? [-10, 10] : [0]; // DOLTEN holds two guns
      const wimg = T.rainbow ? (rainbowCanvas(T.weapon) || images[T.weapon]) : images[T.weapon];
      if (T.id === 'baklavada' && wimg) {
        // Large, readable sword held out in front; preserve the PNG aspect ratio.
        const iw = wimg.naturalWidth || wimg.width || 1, ih = wimg.naturalHeight || wimg.height || 1;
        const longSide = s * 1.42, ratio = iw / ih;
        const dw = ratio >= 1 ? longSide : longSide * ratio;
        const dh = ratio >= 1 ? longSide / ratio : longSide;
        ctx.rotate(-0.18 - t.punch * 0.18);
        ctx.shadowColor = 'rgba(70,235,255,.95)'; ctx.shadowBlur = 13;
        ctx.drawImage(wimg, s * 0.12, -dh * 0.5, dw, dh);
        ctx.shadowBlur = 0;
      } else if (T.weapon && wimg) { for (const o of gunOffsets) ctx.drawImage(wimg, 0, o - h / 2, w, h); }
      else if (!T.support && !T.farm) { ctx.fillStyle = '#ccc'; for (const o of gunOffsets) ctx.fillRect(0, o - 4, w, 8); }
      ctx.restore();
    }
  }

  // Flying rainbow swords (BAKLAVADA boomerangs), spinning.
  for (const t of towers) {
    if (!t.boom) continue;
    const T = t.type, b = t.boom;
    const im = rainbowCanvas(T.weapon) || images[T.weapon];
    const sz = Math.max(86, (T.weaponLen || 40) * 1.72);
    ctx.save();
    if ((t.disabledTimer || 0) > 0) ctx.filter = 'grayscale(1) brightness(.72)';
    // Smooth, flowing rainbow trail: layered glow + a tapered multicolour ribbon.
    const trail = b.trail || [];
    if (trail.length > 1) {
      const oldest = trail[0], newest = trail[trail.length - 1];
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      const path = () => {
        ctx.beginPath();
        ctx.moveTo(oldest.x, oldest.y);
        for (let i = 1; i < trail.length - 1; i++) {
          const p = trail[i], n = trail[i + 1];
          ctx.quadraticCurveTo(p.x, p.y, (p.x + n.x) * 0.5, (p.y + n.y) * 0.5);
        }
        ctx.lineTo(newest.x, newest.y);
      };
      const alpha = Math.max(0.15, 1 - newest.age / 0.24);
      const grad = ctx.createLinearGradient(oldest.x, oldest.y, newest.x, newest.y);
      grad.addColorStop(0, 'rgba(255,55,190,0.02)');
      grad.addColorStop(0.18, 'rgba(255,70,100,0.35)');
      grad.addColorStop(0.36, 'rgba(255,210,65,0.62)');
      grad.addColorStop(0.54, 'rgba(100,255,125,0.72)');
      grad.addColorStop(0.72, 'rgba(70,225,255,0.82)');
      grad.addColorStop(0.88, 'rgba(125,100,255,0.78)');
      grad.addColorStop(1, 'rgba(255,255,255,0.96)');
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = grad;
      ctx.lineWidth = 19;
      ctx.shadowColor = '#9d7bff'; ctx.shadowBlur = 24;
      path(); ctx.stroke();
      ctx.lineWidth = 10;
      ctx.shadowColor = '#65f5ff'; ctx.shadowBlur = 15;
      path(); ctx.stroke();
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(255,255,255,.96)'; ctx.shadowColor = '#fff'; ctx.shadowBlur = 8;
      path(); ctx.stroke();
      // Small soft sparks along the wake make it feel like air being cut, not a hard line.
      for (let i = 2; i < trail.length; i += 4) {
        const p = trail[i], fade = Math.max(0, 1 - p.age / 0.24);
        ctx.globalAlpha = fade * 0.72;
        ctx.fillStyle = i % 2 ? '#7df8ff' : '#ff9ef5';
        ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 10;
        ctx.beginPath(); ctx.arc(p.x, p.y, 1.5 + fade * 2.1, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }
    if ((t.disabledTimer || 0) > 0) ctx.filter = 'grayscale(1) brightness(.72)';
    ctx.translate(b.x, b.y);
    const vx = b.x - (b.prevX ?? b.x), vy = b.y - (b.prevY ?? b.y);
    // Spin the sword visibly while it travels; don't lock its blade to the flight vector.
    ctx.rotate(b.spin + Math.atan2(vy, vx) * 0.12);
    if (im) {
      const iw = im.width || im.naturalWidth || 1, ih = im.height || im.naturalHeight || 1;
      const ratio = iw / ih;
      const dw = ratio >= 1 ? sz : sz * ratio;
      const dh = ratio >= 1 ? sz / ratio : sz;
      ctx.shadowColor = '#69f7ff'; ctx.shadowBlur = 18;
      ctx.drawImage(im, -dw / 2, -dh / 2, dw, dh);
      ctx.shadowBlur = 0;
    } else { ctx.fillStyle = '#fff'; ctx.fillRect(-sz / 2, -3, sz, 6); }
    ctx.restore();
  }

  // Notes and sparks float out of DOGODA on beat; they animate with the song and fade smoothly.
  for (const particle of musicParticles) {
    const alpha = Math.max(0, Math.min(1, particle.life / particle.maxLife));
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(particle.x, particle.y);
    ctx.rotate(particle.rot);
    ctx.font = 'bold ' + Math.round(particle.size) + 'px Georgia, serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = particle.color;
    ctx.shadowColor = particle.color; ctx.shadowBlur = 7;
    ctx.fillText(particle.glyph, 0, 0);
    ctx.restore();
  }

  // Floating "+gold" from MAX farm towers.
  for (const f of floatTexts) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, f.life / 0.5));
    ctx.font = '12px "Press Start 2P", monospace';
    ctx.textAlign = 'center';
    ctx.lineWidth = 4; ctx.strokeStyle = '#000';
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = '#ffd95a'; ctx.fillText(f.text, f.x, f.y);
    ctx.restore();
  }

  let hovered = null, hd = 1e9;
  for (const e of enemies) {
    const s = e.size;
    const air = e.isBoss ? 0 : Math.abs(Math.sin(time * 7 + e.phase));
    const hop = e.isBoss ? Math.abs(Math.sin(time * 5.2 + e.phase)) * 2.2 : air * 8;
    const bossJiggle = e.isBoss ? Math.sin(time * 8.5 + e.phase) : 0;
    const sq = e.isBoss ? bossJiggle * 0.055 : (0.5 - air) * 0.2;
    if (e.isBoss && e.slamFlash > 0) {
      ctx.save();
      ctx.globalAlpha = Math.min(0.8, e.slamFlash);
      ctx.strokeStyle = '#b8c4cc'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(e.x, e.y, (1 - e.slamFlash / 0.75) * (selectedDifficulty === 'hard' ? 166 : selectedDifficulty === 'medium' ? 150 : 138), 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
    ctx.save();
    ctx.translate(e.x + (e.isBoss ? Math.sin(time * 10 + e.phase) * 1.8 : 0), e.y + s / 2 - hop);
    if (e.isBoss) ctx.rotate(bossJiggle * 0.045);
    ctx.scale((1 + sq) * e.flip, 1 - sq);
    // Walk animation: desert boss = sandboss/sandboss2, fast sandity = sandity1/2/3.
    let imgKey = e.img;
    if (e.walkImgs) {
      imgKey = e.walkImgs[Math.floor(time * e.walkFps + e.phase) % e.walkImgs.length];
      if (!images[imgKey]) imgKey = e.walkImgs[0];
    }
    drawImg(imgKey, -s / 2, -s, s, s, e.isBoss ? '#454b55' : e.type === 'greenistan' ? '#2d2' : e.type.startsWith('sandity') ? '#e0b050' : '#d33');
    ctx.restore();
    if (mouse.x >= 0) {
      const d = Math.hypot(mouse.x - e.x, mouse.y - e.y);
      if (d < s / 2 + 6 && d < hd) { hd = d; hovered = e; }
    }
  }

  if (hovered && running) {
    const e = hovered, s = e.size;
    const bw = e.isBoss ? 100 : 56, bx = e.x - bw / 2, by = e.y - s / 2 - 22;
    ctx.fillStyle = '#000'; ctx.fillRect(bx - 2, by - 2, bw + 4, 12);
    ctx.fillStyle = '#400'; ctx.fillRect(bx, by, bw, 8);
    const pct = Math.max(0, e.hp / e.maxHp);
    ctx.fillStyle = pct > 0.5 ? '#0f0' : pct > 0.25 ? '#fd0' : '#f33';
    ctx.fillRect(bx, by, bw * pct, 8);
    ctx.font = '8px "Press Start 2P", monospace';
    ctx.textAlign = 'center';
    ctx.lineWidth = 3; ctx.strokeStyle = '#000';
    const txt = (e.isBoss ? 'BOSS ' : '') + Math.ceil(e.hp) + '/' + Math.ceil(e.maxHp);
    ctx.strokeText(txt, e.x, by - 5);
    ctx.fillStyle = '#fff'; ctx.fillText(txt, e.x, by - 5);
    ctx.textAlign = 'left';
  }

  for (const b of bullets) {
    const isGuitar = b.type.id === 'dogoda'; // legacy guard; support-only DOGODA never creates bullets
    const projectileName = b.projectile || b.type.bullet;
    const s = b.type.bulletSize;
    const pulse = isGuitar ? dogodaMotionPulse() : 0;
    ctx.save();
    // Support-only DOGODA never fires projectiles; this renderer remains for ordinary towers.
    if (b.owner && (b.owner.disabledTimer || 0) > 0) ctx.filter = 'grayscale(1) brightness(.72)';
    else if (isGuitar) ctx.filter = 'none';
    else setHue(b.type.hue);
    ctx.translate(b.x, b.y);
    const spin = isGuitar ? Math.sin(time * 22 + (b.phase || 0)) * 0.38 + (time - (b.birthTime || time)) * 3.6 : 0;
    ctx.rotate(b.angle + spin);
    const drawSize = s * (isGuitar ? 1 + pulse * 0.20 : 1);
    drawImg(projectileName, -drawSize / 2, -drawSize / 2, drawSize, drawSize, isGuitar ? '#f7c94b' : '#ff0');
    ctx.restore();
  }
  ctx.filter = 'none';
}

/* ================== FALLING LEAVES (main menu) ================== */
const lcv = $('leafCv'), lctx = lcv.getContext('2d');
let leaves = [], leafTimer = 0;
function newLeaf(y) {
  return { x: Math.random() * 960, y, vy: 22 + Math.random() * 30, sw: 20 + Math.random() * 40, ph: Math.random() * 6.28,
    f: 0.4 + Math.random() * 0.8, rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 1.4, s: 22 + Math.random() * 18,
    hue: Math.floor(Math.random() * 50 - 25) };
}
for (let i = 0; i < 18; i++) leaves.push(newLeaf(Math.random() * 700));
function drawLeaves(dt) {
  leafTimer -= dt;
  if (leafTimer <= 0 && leaves.length < 40) { leafTimer = 0.3 + Math.random() * 0.5; leaves.push(newLeaf(-40)); }
  lctx.clearRect(0, 0, 960, 720);
  for (const l of leaves) {
    l.y += l.vy * dt; l.rot += l.vr * dt;
    const px = l.x + Math.sin(time * l.f + l.ph) * l.sw;
    lctx.save();
    lctx.translate(px, l.y);
    lctx.rotate(l.rot + Math.sin(time * l.f + l.ph) * 0.4);
    if (images.leaves) {
      lctx.filter = 'hue-rotate(' + l.hue + 'deg)';
      lctx.drawImage(images.leaves, -l.s / 2, -l.s / 2, l.s, l.s);
    } else {
      lctx.fillStyle = '#5a9a3a';
      lctx.beginPath(); lctx.ellipse(0, 0, l.s / 2, l.s / 4, 0, 0, Math.PI * 2); lctx.fill();
    }
    lctx.restore();
  }
  lctx.filter = 'none';
  leaves = leaves.filter(l => l.y < 760);
}

/* ================== LOOP ================== */
function loop(ts) {
  // IMPORTANT: never update gameplay while hidden. Some browsers still deliver
  // throttled animation frames in background tabs; updating on those frames and
  // then catching up on visibility return caused the elapsed time to be counted
  // twice, making waves jump/freeze unexpectedly.
  if (document.hidden) {
    requestAnimationFrame(loop);
    return;
  }
  const dt = Math.min(Math.max(0, (ts - last) / 1000 || 0), 0.05);
  last = ts;
  time += dt;
  if (running) update(dt);
  render();
  if (!$('menu').classList.contains('hidden')) drawLeaves(dt);
  requestAnimationFrame(loop);
}

// The canvas cannot animate while a browser suspends a hidden page. Instead,
// freeze updates while hidden and accurately simulate the elapsed wall-clock time
// on return. pagehide/pageshow also cover leaving and returning via browser history
// (including BFCache), where visibilitychange alone is not always sufficient.
function markBackgroundStart() {
  if (hiddenSince === null) hiddenSince = Date.now();
}

function resumeFromBackground() {
  if (document.hidden || hiddenSince === null) {
    last = performance.now();
    return;
  }
  let elapsed = Math.max(0, (Date.now() - hiddenSince) / 1000);
  hiddenSince = null;

  // Small fixed steps keep enemy path movement, tower cooldowns, projectiles,
  // spawn queues, countdowns and base damage consistent with normal gameplay.
  while (elapsed > 0.000001 && running) {
    const step = Math.min(0.05, elapsed);
    time += step;
    update(step);
    elapsed -= step;
  }

  // Do not count the hidden duration a second time on the next animation frame.
  last = performance.now();
  render();
  if (!$('menu').classList.contains('hidden')) drawLeaves(0);
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) markBackgroundStart();
  else resumeFromBackground();
});
window.addEventListener('pagehide', markBackgroundStart);
window.addEventListener('pageshow', () => {
  if (document.hidden) markBackgroundStart();
  else resumeFromBackground();
});
save();
setGemIcons();
reset();
running = false;
buildTowerShop();
requestAnimationFrame(t => { last = t; loop(t); });

function fit() {
  const s = Math.min(innerWidth / 960, innerHeight / 720);
  $('stage').style.transform = 'scale(' + s + ')';
}
addEventListener('resize', fit); fit();
</script>
</body>
